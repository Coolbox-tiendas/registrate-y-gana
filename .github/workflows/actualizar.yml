name: Actualizar dashboard

on:
  schedule:
    - cron: "*/10 * * * *"     # cada 10 minutos (GitHub puede demorar unos minutos)
  workflow_dispatch:            # permite correrlo a mano desde la pestaña Actions
  push:
    branches: [main]            # también al subir cambios (por ejemplo, metas nuevas)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Leer PostgreSQL y generar datos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python actualizar.py
      - name: Armar sitio
        run: |
          mkdir _site
          cp index.html _site/
          cp -r data _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
